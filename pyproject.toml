[project]
name = "football-ml-prediction"
version = "0.1.0"
description = "Predicao de resultados do Brasileirao com Naive Bayes."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "lime>=0.2.0,<0.3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.4,<2.0",
    "scipy>=1.11,<2.0",
    "shap>=0.45,<1.0",
    "xgboost>=2.0,<4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0,<7.0",
    "nbclient>=0.10,<1.0",
    "nbconvert>=7.0,<8.0",
    "ruff (>=0.16.0,<0.17.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"