[project]
name = "football-ml-prediction"
version = "0.1.0"
description = "Predicao de resultados do Brasileirao com Naive Bayes."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.4,<2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0,<7.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"